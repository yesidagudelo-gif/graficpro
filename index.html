<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<link type="text/css" href="css/styles.css" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
    }

    .calculator-container {
        background: linear-gradient(135deg, #1a2332 0%, #0f1824 100%);
        border-radius: 25px;
        padding: 30px;
        box-shadow: 
            0 20px 60px rgba(0, 0, 0, 0.8),
            0 0 40px rgba(26, 188, 156, 0.1),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(26, 188, 156, 0.2);
        max-width: 320px;
        width: 100%;
    }

    .calculator-title {
        text-align: center;
        color: #1abc9c;
        margin-bottom: 25px;
        font-size: 1.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .display {
        background: linear-gradient(135deg, #0f1824 0%, #1a2332 100%);
        border: 2px solid #1abc9c;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 25px;
        text-align: right;
        min-height: 80px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        box-shadow: 
            inset 0 2px 10px rgba(0, 0, 0, 0.5),
            0 0 20px rgba(26, 188, 156, 0.2);
    }

    #resultado {
        font-size: 2.5rem;
        font-weight: 300;
        color: #1abc9c;
        text-shadow: 0 0 10px rgba(26, 188, 156, 0.5);
        word-wrap: break-word;
        word-break: break-all;
        max-width: 100%;
    }

    .calculator-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    .calc-btn {
        padding: 20px !important;
        font-size: 1.3rem !important;
        font-weight: 600 !important;
        border: none !important;
        border-radius: 12px !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .calc-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }

    .calc-btn:active::before {
        width: 300px;
        height: 300px;
    }

    .calc-btn.number {
        background: linear-gradient(135deg, #16a085 0%, #1abc9c 100%) !important;
        color: #fff !important;
        box-shadow: 
            0 5px 15px rgba(26, 188, 156, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
    }

    .calc-btn.number:hover {
        transform: translateY(-2px);
        box-shadow: 
            0 10px 25px rgba(26, 188, 156, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
    }

    .calc-btn.number:active {
        transform: translateY(0);
        box-shadow: 
            0 3px 10px rgba(26, 188, 156, 0.3),
            inset 0 2px 5px rgba(0, 0, 0, 0.2) !important;
    }

    .calc-btn.operator {
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%) !important;
        color: #fff !important;
        box-shadow: 
            0 5px 15px rgba(231, 76, 60, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
    }

    .calc-btn.operator:hover {
        transform: translateY(-2px);
        box-shadow: 
            0 10px 25px rgba(231, 76, 60, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
    }

    .calc-btn.operator:active {
        transform: translateY(0);
        box-shadow: 
            0 3px 10px rgba(231, 76, 60, 0.3),
            inset 0 2px 5px rgba(0, 0, 0, 0.2) !important;
    }

    .calc-btn.special {
        background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%) !important;
        color: #fff !important;
        font-weight: 700 !important;
        box-shadow: 
            0 5px 15px rgba(26, 188, 156, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
    }

    .calc-btn.special:hover {
        transform: translateY(-2px);
        box-shadow: 
            0 10px 25px rgba(26, 188, 156, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
    }

    .calc-btn.special:active {
        transform: translateY(0);
        box-shadow: 
            0 3px 10px rgba(26, 188, 156, 0.4),
            inset 0 2px 5px rgba(0, 0, 0, 0.2) !important;
    }

    @media (max-width: 480px) {
        .calculator-container {
            padding: 20px;
        }

        .calc-btn {
            padding: 16px !important;
            font-size: 1.1rem !important;
        }

        #resultado {
            font-size: 2rem;
        }
    }
</style>
</head>
<body onload="init();">
    <div class="calculator-container">
        <h1 class="calculator-title">Calculadora</h1>
        <div class="display">
            <span id="resultado">0</span>
        </div>
        <div class="calculator-buttons">
            <button id="siete" class="calc-btn number">7</button>
            <button id="ocho" class="calc-btn number">8</button>
            <button id="nueve" class="calc-btn number">9</button>
            <button id="division" class="calc-btn operator">÷</button>

            <button id="cuatro" class="calc-btn number">4</button>
            <button id="cinco" class="calc-btn number">5</button>
            <button id="seis" class="calc-btn number">6</button>
            <button id="multiplicacion" class="calc-btn operator">×</button>

            <button id="uno" class="calc-btn number">1</button>
            <button id="dos" class="calc-btn number">2</button>
            <button id="tres" class="calc-btn number">3</button>
            <button id="resta" class="calc-btn operator">−</button>

            <button id="cero" class="calc-btn number">0</button>
            <button id="punto" class="calc-btn number">.</button>
            <button id="igual" class="calc-btn special">=</button>
            <button id="suma" class="calc-btn operator">+</button>

            <button id="reset" class="calc-btn operator" style="grid-column: 1 / -1;">C (Limpiar)</button>
        </div>
    </div>
<script src="js/js.js"></script>
</body>
</html>
